networking:
  port: 9418

runtime:
  num_threads: 4
  queue_depth: 1024

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "256MB"

  # CTE core: persistence target for summaries.
  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "513.0"
    storage:
      - path: "ram::cte_ram_tier1"
        bdev_type: "ram"
        capacity_limit: "128MB"
        score: 1.0
    dpe:
      dpe_type: "max_bw"

  # Clio FS over the CTE core above: the Code Indexer reads files from here,
  # never from the disk. next_pool_id points at the core pool below it.
  - mod_name: clio_cte_filesystem
    pool_name: clio_cte_filesystem
    pool_query: local
    pool_id: "560.0"
    next_pool_id: "513.0"

  # Code Indexer: stub embedder + stub summarizer, summaries persisted to
  # tag "ci_summaries" in the CTE core above. embed_batch 1 keeps the stub's
  # fixed one-vector reply well-formed.
  - mod_name: clio_cae_code_indexer
    pool_name: code_indexer
    pool_query: local
    pool_id: "402.0"
    embed_endpoint: "http://127.0.0.1:21436"
    embed_model: "stub-embed"
    embed_api: "ollama"
    embed_batch: 1
    summarize_endpoint: "http://127.0.0.1:21437"
    summarize_model: "stub-summarizer"
    cte_pool_id: "513.0"
    cte_tag: "ci_summaries"
